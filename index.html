<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Basura al Cubo</title>
    <link rel="icon" type="image/png" href="./assets/img/Recoge_basura.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark glass-navbar">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold" href="#">
      🗑️ Basura al Cubo
    </a>

    <div class="ms-auto text-white">
      Desarrollado por: <strong>Jesus Roberto Hernandez</strong>
    </div>

  </div>
</nav>

<!-- PANTALLA INTRO -->
<div id="pantallaInicio">

    <div class="overlay"></div>

    <div class="contenidoInicio">

        <h1>BASURA AL CUBO</h1>

        <div id="textoIntro" class="instrucciones"></div>

        <h2 id="mensajeFinal">¡¡SALVA AL MUNDO!!</h2>

        <button id="btnComenzar" class="btn btn-success mt-3">
            Comenzar Juego
        </button>

    </div>

</div>

<audio id="sonidoIntro" src="assets/retro.mp3"></audio>
    
<div class="container-fluid">

    <div class="row text-center mt-3">
        <h1>🗑️ Basura al Cubo</h1>
    </div>

    <!-- PANEL DE INFORMACION -->
    <div class="row mt-3">

        <!-- CANVAS -->
        <div class="col-md-6 text-center">

            <canvas id="canvasJuego" width="800" height="500"></canvas>

        </div>

        <!-- SCORE -->
        <div class="col-md-3">

            <div class="card p-3">

                <h4>Score</h4>
                <h2 id="score">0</h2>

                <h4>Record</h4>
                <h2 id="record">0</h2>

                <h4>Salud</h4>

                <div class="progress">
                    <div id="saludBarra"
                         class="progress-bar bg-danger"
                         style="width:100%">
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="./assets/js/main.js"></script>

<footer class="footer text-center">
    <p>
        © 2026 | Basura al Cubo <br>
        Desarrollado por: <strong>Jesus Roberto Hernandez</strong>
    </p>
</footer>
</body>
</html>
